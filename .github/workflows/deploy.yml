name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx cdk synth --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: cdk.out
          if-no-files-found: error

  staging:
    needs: synth
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: staging

  prod:
    needs: staging
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: prod
