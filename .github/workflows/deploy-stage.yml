name: Deploy stage

on:
  workflow_call:
    inputs:
      stage:
        description: Stage to deploy (staging or prod)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    concurrency:
      group: deploy-${{ inputs.stage }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: cdk-out
          path: cdk.out
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/rsc-mfe-gh-${{ inputs.stage }}
          aws-region: eu-central-1
      - name: Deploy
        env:
          STAGE: ${{ inputs.stage }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: >
          npx cdk deploy --app cdk.out --require-approval never
          --role-arn "arn:aws:iam::${ACCOUNT_ID}:role/rsc-mfe-cfn-exec-${STAGE}"
          --outputs-file outputs.json
          "${STAGE}/*"
      - name: Smoke test
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          url=$(jq -er --arg k "rsc-mfe-${STAGE}-edge" '.[$k].DistributionUrl' outputs.json)
          url="${url%/}"
          for path in / /orders /store /shell-static/fragments/header.js; do
            echo "GET ${url}${path}"
            curl -fsS -o /dev/null --retry 5 --retry-all-errors --retry-delay 10 "${url}${path}"
          done
          # The pages reference hashed files in S3; fetch one so a missing asset fails the deploy.
          html=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 10 "${url}/")
          asset=$(grep -oE '/[A-Za-z0-9_./-]*assets/[A-Za-z0-9_.-]+\.js' <<< "$html" | head -n 1 || true)
          test -n "$asset" || { echo "no hashed asset found in ${url}/"; exit 1; }
          echo "GET ${url}${asset}"
          curl -fsS -o /dev/null --retry 5 --retry-all-errors --retry-delay 10 "${url}${asset}"
