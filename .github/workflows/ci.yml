name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx cdk synth --quiet
      # Fork PRs get no AWS access; they stop after the checks above.
      - name: Assume the read-only diff role
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/rsc-mfe-gh-diff
          aws-region: eu-central-1
      - name: cdk diff
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: false
        shell: bash
        run: |
          npx cdk diff --app cdk.out --no-change-set 'staging/*' 'prod/*' 'bootstrap-*' 2>&1 | tee diff.txt
          {
            echo '## cdk diff'
            echo '```'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
